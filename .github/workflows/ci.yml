name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - name: Instalar dotnet-ef
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.15
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.dotnet\tools"
      - run: dotnet test backend --configuration Release
      - run: dotnet-ef migrations has-pending-model-changes -p backend/src/Arquitectos.Infrastructure -s backend/src/Arquitectos.Api --configuration Release
      - run: dotnet list backend package --vulnerable --include-transitive
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test --if-present
      - run: npm audit --audit-level=high
