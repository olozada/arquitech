name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - name: Instalar dotnet-ef
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.15
          Add-Content -Path $env:GITHUB_PATH -Value "$env:USERPROFILE\.dotnet\tools"
      # Coverlet alarga la prueba de volumen y el tope de 1,5 s deja de medir el código.
      - name: Prueba de volumen
        run: dotnet test backend --configuration Release --filter FullyQualifiedName~VolumenAlertasTests
      - name: Pruebas con cobertura
        run: dotnet test backend --configuration Release --settings backend/cobertura.runsettings --collect:"XPlat Code Coverage" --results-directory backend/cobertura --filter FullyQualifiedName!~VolumenAlertasTests
      - name: Umbral de cobertura
        shell: pwsh
        working-directory: backend
        run: ./scripts/resumen-cobertura.ps1
      - run: dotnet-ef migrations has-pending-model-changes -p backend/src/Arquitectos.Infrastructure -s backend/src/Arquitectos.Api --configuration Release
      - run: dotnet list backend package --vulnerable --include-transitive
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - name: Restaurar herramientas de .NET
        working-directory: backend
        run: dotnet tool restore
      - name: Regenerar tipos de OpenAPI
        run: npm run api:tipos
      - name: Los tipos generados coinciden con el repositorio
        run: git diff --exit-code -- src/api/esquema.ts
      - run: npm run lint
      - run: npm run build
      - run: npm test -- --coverage
      - name: Publicar cobertura del frontend
        run: node scripts/resumen-cobertura.mjs
      - run: npm audit --audit-level=high
