name: movil
on:
  push:
    paths:
      - 'movil/**'
      - '.github/workflows/movil.yml'
  pull_request:
    paths:
      - 'movil/**'
      - '.github/workflows/movil.yml'
jobs:
  movil:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: movil
    steps:
      - uses: actions/checkout@v4
      - name: Leer versión de Flutter
        shell: bash
        run: echo "FLUTTER_VERSION=$(tr -d '\r\n' < movil/.flutter-version)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test --coverage --concurrency=1
      - name: Cobertura core y sincronización
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lcov > /dev/null
          lcov --extract coverage/lcov.info 'lib/core/*' 'lib/sincronizacion/*' -o coverage/movil-core.info
          PCT=$(lcov --summary coverage/movil-core.info 2>&1 | awk '/lines/{print $2}' | tr -d '%')
          echo "Cobertura líneas core+sync: ${PCT}%"
          awk "BEGIN{exit !(${PCT} >= 60)}"
      - run: flutter build apk --debug
  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: movil
    steps:
      - uses: actions/checkout@v4
      - name: Leer versión de Flutter
        shell: bash
        run: echo "FLUTTER_VERSION=$(tr -d '\r\n' < movil/.flutter-version)" >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter --version
      - run: flutter pub get
      - run: flutter build ios --no-codesign
